version: 1
formatters:
  simple:
    format: "[%(asctime)s][%(name)s][%(levelname)s] - %(message)s"
    datefmt: "%d/%m/%Y %H:%M:%S"
  colorlog:
    '()': 'colorlog.ColoredFormatter'
    format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s] - %(message)s'
    datefmt: "%d/%m/%Y %H:%M:%S"
    log_colors:
      DEBUG: purple
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red
handlers:
  console:
    class: logging.StreamHandler
    formatter: colorlog
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra:run.dir}/main.log
filters:
  mlflow_name_filter:
    (): modules.MLFlowNameFilter
root:
  handlers: [console, file]
loggers:
  mlflow:
    level: INFO
    filters: [mlflow_name_filter]
    handlers: [console, file]
    propagate: no

disable_existing_loggers: false